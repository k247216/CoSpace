# 端口
server.port=8080

# 上传文件大小限制
spring.servlet.multipart.max-file-size=3072MB
spring.servlet.multipart.max-request-size=3072MB
spring.mvc.servlet.load-on-startup=1

# 数据源
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cospace?connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}


# 应用
spring.application.name=cospace-api

# 分享
rpan.share-prefix=http://127.0.0.1:7001/share/

# 缓存
#rpan.cache.type=com.rubin.rpan.cache.local.LocalCache

rpan.cache.type=com.rubin.rpan.cache.redis.RedisCache
rpan.cache.redis.database=1
rpan.cache.redis.host=127.0.0.1
rpan.cache.redis.port=6379
rpan.cache.redis.password=${RPAN_CACHE_REDIS_PASSWORD:}

# 存储
rpan.storage.processor.type=com.rubin.rpan.storage.local.LocalStorageProcessor
# 老文件没有存储类型。切换默认适配器时，用 rpan.storage.legacy-type 指向老文件实际使用的存储。
rpan.storage.local.root-file-path=./runtime/files

#rpan.storage.processor.type=com.rubin.rpan.storage.fastdfs.FastDFSStorageProcessor
#rpan.storage.fdfs.group=group1
#rpan.storage.fdfs.connect-timeout=600
#rpan.storage.fdfs.tracker-list[0]=127.0.0.1:22122

# For new uploads to an existing private Alibaba Cloud OSS bucket:
#rpan.upload.storage-type=com.rubin.rpan.storage.oss.OssStorageProcessor
#rpan.storage.oss.enabled=true
#rpan.storage.oss.region=cn-hangzhou
#rpan.storage.oss.bucket-name=bucket-name
#rpan.storage.oss.endpoint=https://oss-cn-hangzhou.aliyuncs.com

# 日志
logging.file.name=${user.home}/logs/${spring.application.name}/${spring.application.name}.log
logging.level.root=INFO

# MyBatis
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.rubin.rpan.**.entity

# 监控
management.endpoints.web.exposure.include=health,info

# 可靠清理：本地存储消费者与文件位于同一机器。
rpan.cleanup.enabled=true
rpan.cleanup.nameserver=127.0.0.1:9876
rpan.cleanup.topic=rpan-file-cleanup
rpan.cleanup.producer-group=rpan-cleanup-producer
rpan.cleanup.consumer-group=rpan-cleanup-consumer
rpan.cleanup.scan-delay-ms=5000
rpan.cleanup.batch-size=20
rpan.cleanup.max-attempts=5
rpan.cleanup.lease-ms=30000
rpan.cleanup.retry-delay-ms=10000
rpan.cleanup.redelivery-ms=60000

# 新前端已接入分片任务API；当前仅支持单实例本地存储。
rpan.upload.chunk-size=2097152
rpan.upload.max-file-size=3221225472
rpan.upload.max-chunks=10000
rpan.upload.task-ttl-ms=86400000
# 独立于旧temp清理目录，避免旧清理器直接删除新任务目录。
rpan.upload.staging-path=./runtime/uploads

# 暂存垃圾清理：接收中任务到期回收，收尾中任务额外保留恢复窗口。
rpan.upload.gc.enabled=true
rpan.upload.gc.initial-delay-ms=60000
rpan.upload.gc.scan-delay-ms=60000
rpan.upload.gc.batch-size=50
rpan.upload.gc.finalizing-retention-ms=604800000

# 用户逻辑空间：默认10GiB，已存在用户由增量迁移回填
rpan.space.default-total-bytes=10737418240
# 仅上传初始化按用户限流：允许突发10次，每秒补充1次
rpan.upload.init-limit.enabled=true
rpan.upload.init-limit.capacity=10
rpan.upload.init-limit.refill-interval-ms=1000

# Enable team functionality for a fresh CoSpace installation.
rpan.workspace.enabled=true
